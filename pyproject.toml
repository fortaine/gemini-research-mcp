[project]
name = "gemini-research-mcp"
dynamic = ["version"]
description = "MCP server for AI-powered research using Gemini: quick grounded search + Deep Research Agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Guillaume Fortaine", email = "guillaume.fortaine+github@machinemates.ai" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "gemini",
    "research",
    "ai",
    "deep-research",
    "grounding",
    "google-search",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Typing :: Typed",
]
dependencies = [
    # Latest stable google-genai SDK (verified against PyPI at implementation time)
    "google-genai>=2.20.0,<3.0.0",
    # FastMCP 4 beta: sessionless protocol (2026-07-28), Tasks extension, BM25 tool search
    "fastmcp[tasks]==4.0.0b5",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.1",
    # Persistent storage using industry-standard key-value interface (used by FastMCP, agentpool, etc.)
    "py-key-value-aio[disk]>=0.4.5,<0.5.0",
    # XDG-compliant platform-specific directories
    "platformdirs>=4.5.1",
]

[tool.uv]
# uv only allows prereleases for packages explicitly named here. fastmcp-slim and
# fastmcp-tasks are transitive dependencies of fastmcp[tasks] and must be pinned
# to the exact same beta to keep resolution deterministic.
constraint-dependencies = [
    "fastmcp-slim==4.0.0b5",
    "fastmcp-tasks==4.0.0b5",
]

[project.optional-dependencies]
# DOCX export uses marko (Markdown→AST) + python-docx (native DOCX generation)
# Zero external runtime dependencies - pure Python, no Pandoc binary needed
# Optional: pygments for syntax highlighting in code blocks
docx = [
    "marko>=2.2.2",
    "python-docx>=1.2.0",
    "pygments>=2.19.2",
]
# High-quality web content extraction (F1: 0.937)
# Falls back to basic HTML parsing if not installed
web = [
    "trafilatura>=2.0.0",
    "protego>=0.3.1",
]
# Shared session/export/task storage across multiple server instances (stateless
# HTTP deployments, horizontal scaling). Not required for local stdio usage.
distributed = [
    "py-key-value-aio[redis]>=0.4.5,<0.5.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.3.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "marko>=2.2.2",
    "python-docx>=1.2.0",
    "pygments>=2.19.2",
    "trafilatura>=2.0.0",
    "protego>=0.3.1",
    "types-Pygments>=2.19.0",
]

[project.urls]
Homepage = "https://github.com/machinemates-ai/gemini-research-mcp"
Documentation = "https://github.com/machinemates-ai/gemini-research-mcp#readme"
Repository = "https://github.com/machinemates-ai/gemini-research-mcp"
Issues = "https://github.com/machinemates-ai/gemini-research-mcp/issues"

[project.scripts]
gemini-research-mcp = "gemini_research_mcp.server:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata]

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_research_mcp"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/vscode-extension/node_modules",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests that require GEMINI_API_KEY",
    "redis: opt-in tests requiring a live Redis/Valkey instance (GEMINI_RESEARCH_REDIS_TEST_URL)",
]
addopts = "-m 'not e2e and not redis'"

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = "fastmcp.server.transforms.search"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["protego"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
